name: ❓ Question
description: Report your question here
title: "[Question]: "
labels: ["question❓️"]

body:
  - type: textarea
    id: description
    attributes:
        label: "📋 Description"
        description: A clear and concise description of the question.
    validations:
        required: true

  - type: input
    id: snakengs_version
    attributes:
        label: "🔖 SnakeNgs Version"
        description: "Required: Specify the SnakeNgs version you are using."
        placeholder: "e.g., v0.3.0"
    validations:
        required: true

  - type: textarea
    id: environment
    attributes:
        label: "🔍 Environment"
        description: |
            Optional: The environment information.
            Example:
            OS: WSL (Ubuntu 22.04)
            Python: 3.11
            Snakemake: 9.1.3
        value: |
            OS:
            Python:
            Snakemake:
        render: markdown
    validations:
        required: false

  - type: textarea
    id: anything_else
    attributes:
        label: "📎 Anything else?"
        description: |
            Optional: Add any other contexts, links, or screenshots about the bug here.
    validations:
        required: false
